services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: impact-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: impact_radar
      POSTGRES_USER: impact_radar
      POSTGRES_PASSWORD: impact_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
