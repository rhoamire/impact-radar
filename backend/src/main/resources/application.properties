spring.application.name=impact-radar-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/impact_radar}
spring.datasource.username=${DB_USERNAME:impact_radar}
spring.datasource.password=${DB_PASSWORD:impact_radar}
spring.datasource.driver-class-name=org.postgresql.Driver

impact-radar.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
impact-radar.ollama.model=${OLLAMA_MODEL:gemma4}

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=impact-radar
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Impact Radar provides document change-impact analysis, relationship analysis, and change summaries.
spring.ai.mcp.server.capabilities.tool=true