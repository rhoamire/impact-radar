spring.application.name=impact-radar-backend

spring.datasource.url=jdbc:postgresql://localhost:15432/impact_radar
spring.datasource.username=impact_radar
spring.datasource.password=impact_radar
spring.datasource.driver-class-name=org.postgresql.Driver
impact-radar.ollama.base-url=http://localhost:11434
impact-radar.ollama.model=gemma4
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=impact-radar
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Impact Radar provides document change-impact analysis, relationship analysis, and change summaries.
spring.ai.mcp.server.capabilities.tool=true